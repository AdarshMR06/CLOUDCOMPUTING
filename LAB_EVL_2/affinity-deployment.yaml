
apiVersion: apps/v1
kind: Deployment

metadata:
  name: affinity-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: affinity-demo

  template:
    metadata:
      labels:
        app: affinity-demo

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: lab-role
                    operator: In
                    values:
                      - preferred

      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
